namespace: keycloak

resources:
  - keycloak-operator.yaml
  - keycloaks.k8s.keycloak.org-v1.yaml
  - keycloakrealmimports.k8s.keycloak.org-v1.yaml
  - keycloakoidcclients.k8s.keycloak.org-v1.yaml
  - keycloaksamlclients.k8s.keycloak.org-v1.yaml

patches:
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |-
      # Container: keycloak-operator (index 0)
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
