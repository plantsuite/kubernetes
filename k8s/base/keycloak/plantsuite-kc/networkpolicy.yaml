apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-istio-ambient
spec:
  podSelector:
    matchLabels:
      app: keycloak
  ingress:
    - ports:
        - protocol: TCP
          port: 15008
      from:
        - namespaceSelector:
            matchLabels:
              istio.io/dataplane-mode: ambient
    # JGroups inter-pod traffic (Keycloak cluster / Infinispan)
    # - 7800:  JGroups data transfer
    # - 57800: FD_SOCK2 failure detection
    - ports:
        - protocol: TCP
          port: 7800
        - protocol: TCP
          port: 57800
      from:
        - podSelector:
            matchLabels:
              app: keycloak
  policyTypes:
    - Ingress
