apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: plantsuite-kc-realm
spec:
  keycloakCRName: plantsuite-kc
  placeholders:
    PS_AUTH_INTROSPECTION_SECRET:
      secret:
        name: keycloak
        key: client-secret_ps-auth-introspection
    PS_TENANTS_ADMIN_SECRET:
      secret:
        name: keycloak
        key: client-secret_ps-tenants-admin
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  realm:
    id: plantsuite
    realm: plantsuite
    displayName: PlantSuite
    enabled: true
    registrationAllowed: true
    registrationEmailAsUsername: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    verifyEmail: false
    rememberMe: true
    resetPasswordAllowed: false
    editUsernameAllowed: false
    loginTheme: plantsuite
    accountTheme: plantsuite
    internationalizationEnabled: true
    supportedLocales:
      - pt-BR
      - en
      - es
    defaultLocale: pt-BR

    # ===== Session / token hardening =====
    ssoSessionIdleTimeout: 1800              # 30 min
    ssoSessionMaxLifespan: 28800             # 8 hours
    ssoSessionIdleTimeoutRememberMe: 2592000 # 30 days
    ssoSessionMaxLifespanRememberMe: 31536000 # 365 days
    offlineSessionIdleTimeout: 2592000       # 30 days
    offlineSessionMaxLifespanEnabled: true
    offlineSessionMaxLifespan: 31536000      # 365 days
    accessTokenLifespan: 600                 # 10 min
    refreshTokenMaxReuse: 0
    revokeRefreshToken: false

    # Client Público (autenticação do usuário)
    clients:
      - clientId: ps-iot-portal
        name: PlantSuite Portal Public Client
        description: Public client for user authentication
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        rootUrl: "https://portal.plantsuite.local"
        redirectUris:
          - "https://alarms.plantsuite.local/*"
          - "https://dashboards.plantsuite.local/*"
          - "https://devices.plantsuite.local/*"
          - "https://entities.plantsuite.local/*"
          - "https://mes.plantsuite.local/*"
          - "https://notifications.plantsuite.local/*"
          - "https://portal.plantsuite.local/*"
          - "https://queries.plantsuite.local/*"
          - "https://spc.plantsuite.local/*"
          - "https://tenants.plantsuite.local/*"
          - "https://timeseries.plantsuite.local/*"
          - "https://wd-ui.plantsuite.local/*"
        webOrigins:
          - "*"
        attributes:
          pkce.code.challenge.method: S256
        defaultClientScopes:
          - basic
          - profile
          - email
        optionalClientScopes:
          - offline_access
        protocolMappers:
          - name: audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: ps-iot-portal
              id.token.claim: "false"
              access.token.claim: "true"
          - name: audience-ps-auth-introspection
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: ps-auth-introspection
              id.token.claim: "false"
              access.token.claim: "true"
              introspection.token.claim: "true"
          - name: realm-roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            consentRequired: false
            config:
              "multivalued": "true"
              "claim.name": "realm_access.roles"
              "jsonType.label": "String"
              "userinfo.token.claim": "true"
              "id.token.claim": "false"
              "access.token.claim": "true"
          - name: client-roles-userinfo
            protocol: openid-connect
            protocolMapper: oidc-usermodel-client-role-mapper
            consentRequired: false
            config:
              "usermodel.clientRoleMapping.clientId": "ps-iot-portal"
              "claim.name": "resource_access.ps-iot-portal.roles"
              "jsonType.label": "String"
              "multivalued": "true"
              "userinfo.token.claim": "true"
              "id.token.claim": "false"
              "access.token.claim": "false"
              "introspection.token.claim": "true"

      # Client Confidencial (introspection)
      - clientId: ps-auth-introspection
        name: PlantSuite Introspection Client
        description: Confidential client for token introspection
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        clientAuthenticatorType: client-secret
        secret: "${PS_AUTH_INTROSPECTION_SECRET}"
        defaultClientScopes:
          - profile
          - email

      # Client Confidencial (tenants admin)
      - clientId: ps-tenants-admin
        name: PlantSuite Tenants Admin Client
        description: Confidential client for tenants administration
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        clientAuthenticatorType: client-secret
        secret: "${PS_TENANTS_ADMIN_SECRET}"
        defaultClientScopes:
          - profile
          - email

    # Service Account Role Mappings
    users:
      - username: service-account-ps-auth-introspection
        enabled: true
        serviceAccountClientId: ps-auth-introspection
        clientRoles:
          realm-management:
            - view-users
            - view-clients
            - view-realm

      - username: service-account-ps-tenants-admin
        enabled: true
        serviceAccountClientId: ps-tenants-admin
        clientRoles:
          realm-management:
            - view-users
            - view-clients
            - view-realm
            - manage-users
            - manage-clients
            - manage-realm
            - query-users
            - query-clients
            - query-realms
            - query-groups
