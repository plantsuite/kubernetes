apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: plantsuite-kc
spec:
  instances: 3
  cache:
    configMapFile:
      name: keycloak-cache-ispn
      key: cache-ispn.xml
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi
  db:
    vendor: postgres
    url: jdbc:postgresql://plantsuite-ppgc-pgbouncer.postgresql.svc.cluster.local:5432/keycloak?prepareThreshold=0
    # configuração recomendada para keycloak
    # https://www.keycloak.org/high-availability/single-cluster/concepts-database-connections
    # https://www.keycloak.org/high-availability/single-cluster/deploy-keycloak
    poolInitialSize: 10
    poolMinSize: 10
    poolMaxSize: 10
    usernameSecret:
      key: db_username
      name: keycloak
    passwordSecret:
      key: db_password
      name: keycloak
  hostname:
    hostname: account.plantsuite.local
    strict: true
  http:
    httpEnabled: true
  ingress:
    enabled: false
  networkPolicy:
    enabled: true
    http:
      - namespaceSelector:
          matchLabels:
            istio.io/dataplane-mode: ambient
  proxy:
    headers: xforwarded
  tracing:
    enabled: true
    endpoint: http://dashboard.aspire.svc.cluster.local:4317
    samplerType: parentbased_traceidratio
    samplerRatio: 0.01
  unsupported:
    podTemplate:
      spec:
        containers:
          - name: keycloak
            env:
              - name: KC_CACHE_CONFIG_MUTATE
                value: "true"
              - name: KC_CACHE_STACK
                value: jdbc-ping
              - name: KC_CACHE_EMBEDDED_MTLS_ENABLED
                value: "false"
              # Stable unique JGroups/Infinispan node name per pod (KC 26 SPI)
              - name: KC_SPI_CACHE_EMBEDDED__DEFAULT__NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            volumeMounts:
              - mountPath: /opt/keycloak/providers
                name: keycloak-ps-theme
        volumes:
          - configMap:
              name: keycloak-ps-theme
            name: keycloak-ps-theme
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - plantsuite-kc
                topologyKey: kubernetes.io/hostname
