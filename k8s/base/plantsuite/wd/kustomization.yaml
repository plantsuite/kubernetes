namespace: plantsuite

labels:
  - pairs:
      app: wd
      app.kubernetes.io/name: wd
    includeSelectors: true
    includeTemplates: true

resources:
  - deployment.yaml
  - hpa.yaml
  - virtualservice.yaml
  - pdb.yaml
  - service.yaml

configMapGenerator:
  - name: wd-appsettings
    files:
      - appsettings.json
  - name: wd-appsettings-env
    envs:
      - appsettings.env

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: plantsuite.azurecr.io/wd-api
    newTag: 0.6.0
  - name: plantsuite.azurecr.io/plantsuite-wd
    newTag: 0.6.0
