namespace: vernemq

resources:
  - namespace.yaml
  - virtualservice.yaml

secretGenerator:
  - name: vernemq-env
    envs:
      - .env.secret
  - name: plantsuite-cr
    files:
      - .dockerconfigjson=dockerconfig.json
    type: kubernetes.io/dockerconfigjson

configMapGenerator:
  - name: vernemq-auth
    files:
      - postgres_cockroach_commons.lua

generatorOptions:
  disableNameSuffixHash: true

helmCharts:
  - name: vernemq
    repo: https://vernemq.github.io/docker-vernemq
    version: 2.1.1
    releaseName: plantsuite-vmq
    namespace: vernemq
    valuesFile: helm-values.yaml

patches:
  - target:
      kind: Service
      name: plantsuite-vmq
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: plantsuite-vmq
      spec:
        ports:
          - port: 8080
            appProtocol: kubernetes.io/ws
  # Kustomize v5.8.0+ NamespaceTransformer skips helm-rendered resources, so
  # metadata.namespace is no longer auto-injected. The VerneMQ chart templates
  # (StatefulSet, Service, headless Service) omit namespace: {{ .Release.Namespace }},
  # so these JSON6902 patches force it as a workaround.
  # Ref: https://github.com/kubernetes-sigs/kustomize/issues/6058
  - target:
      kind: StatefulSet
      name: plantsuite-vmq
    patch: |-
      - op: add
        path: /metadata/namespace
        value: vernemq
  - target:
      kind: Service
      name: plantsuite-vmq
    patch: |-
      - op: add
        path: /metadata/namespace
        value: vernemq
  - target:
      kind: Service
      name: plantsuite-vmq-headless
    patch: |-
      - op: add
        path: /metadata/namespace
        value: vernemq
